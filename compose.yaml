services:
  ridepane:
    image: ghcr.io/spikked27/ridepane:latest
    container_name: ridepane
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      PORT: "8080"
      APP_PASSWORD: "${APP_PASSWORD:?Set APP_PASSWORD in .env}"
      PLEX_URL: "${PLEX_URL:?Set PLEX_URL in .env}"
      PLEX_TOKEN: "${PLEX_TOKEN:?Set PLEX_TOKEN in .env}"
      PUBLIC_URL: "${PUBLIC_URL:-}"
